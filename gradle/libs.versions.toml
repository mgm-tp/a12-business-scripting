# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]

# Versions for A12 components
a12DataServicesVersion = "39.1.1"
a12KernelVersion = "31.3.1"

# Versions for CIB 7 components
cibsevenVersion = "2.2.0"

# Versions for other libraries
jacksonVersion = "3.2.4"
kotlinterVersion = "5.0.2"
kotlinVersion = "2.3.0"
# Liquibase 5 changed its license model, so this build stays on the version A12 Data Services
# manages. Declared as 'strictly' because the Spring Boot BOM manages a 5.x version that Gradle's
# conflict resolution would otherwise prefer.
liquibaseVersion = { strictly = "4.33.0" }
polyglotVersion = "25.0.0"
slf4jVersion = "2.0.17"
springBootVersion = "4.1.1"
springFrameworkVersion = "7.0.9"

# Versions for test libraries
awaitilityVersion = "4.3.0"
junitJupiterVersion = "5.10.1"
kotestVersion = "5.9.1"
mockkVersion = "1.14.2"


[libraries]

# A12 libraries
a12-dataservices-client-autoconfig = { group = "com.mgmtp.a12.dataservices", name = "dataservices-client-spring-boot-autoconfigure", version.ref = "a12DataServicesVersion" }
a12-dataservices-core-autoconfig = { group = "com.mgmtp.a12.dataservices", name = "dataservices-core-spring-boot-autoconfigure", version.ref = "a12DataServicesVersion" }
a12-dataservices-domain = { group = "com.mgmtp.a12.dataservices", name = "dataservices-domain", version.ref = "a12DataServicesVersion" }

a12-kernel-md-facade = { group = "com.mgmtp.a12.kernel", name = "kernel-md-facade", version.ref = "a12KernelVersion" }



# CIB 7 libraries
cibseven-engine = { group = "org.cibseven.bpm", name = "cibseven-engine", version.ref = "cibsevenVersion" }

# Other libraries
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlinVersion" }
liquibase-core = { group = "org.liquibase", name = "liquibase-core", version.ref = "liquibaseVersion" }
polyglot = { group = "org.graalvm.polyglot", name = "polyglot", version.ref = "polyglotVersion" }
polyglot-js-community = { group = "org.graalvm.polyglot", name = "js-community", version.ref = "polyglotVersion" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4jVersion" }
spring-boot-config-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor", version.ref = "springBootVersion" }
spring-boot-starter = { group = "org.springframework.boot", name = "spring-boot-starter", version.ref = "springBootVersion" }
spring-context = { group = "org.springframework", name = "spring-context", version.ref = "springFrameworkVersion" }

# Test libraries
testingCatalog-awaitility = { group = "org.awaitility", name = "awaitility", version.ref = "awaitilityVersion" }
testingCatalog-jackson-kotlin = { group = "tools.jackson.module", name = "jackson-module-kotlin", version.ref = "jacksonVersion" }
testingCatalog-junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiterVersion" }
testingCatalog-junit-jupiter-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
testingCatalog-kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotestVersion" }
testingCatalog-kotest-assertions-json = { group = "io.kotest", name = "kotest-assertions-json", version.ref = "kotestVersion" }
testingCatalog-mockk = { group = "io.mockk", name = "mockk", version.ref = "mockkVersion" }
testingCatalog-spring-boot-test = { group = "org.springframework.boot", name = "spring-boot-starter-test", version.ref = "springBootVersion" }

# Libraries for building gradle projects. The two below are compile dependencies of the convention
# plugins in build-support, which every consumer of this repository builds from source.
gradleBuild-kotlin-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlinVersion"}
gradleBuild-kotlinter-plugin = { group = "org.jmailen.gradle", name = "kotlinter-gradle", version.ref = "kotlinterVersion"}


[plugins]

kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinterVersion" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinVersion" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlinVersion" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlinVersion" }

[bundles]

testingCatalog-unittest = [
    "testingCatalog-junit-jupiter",
    "testingCatalog-mockk",
    "testingCatalog-kotest-assertions-core",
    "testingCatalog-kotest-assertions-json",
]
